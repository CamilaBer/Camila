<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRIME - Contact</title>
    <link rel="stylesheet" href="Styles.css">

</head>

<body>

    <main>

        <!-- ================= CONTACT HEADER ================= -->

        <section>

            <p>
                — CONTACT
            </p>

            <h1>
                LET'S TALK?
            </h1>

        </section>


        <!-- ================= CONTACT CONTENT ================= -->

        <section>


            <!-- ================= CONTACT FORM ================= -->

            <div>

                <form>

                    <label for="name">
                        NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your full name"
                    >


                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="youremail@example.com"
                    >


                    <label for="message">
                        MESSAGE
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell us how we can help"
                    ></textarea>


                    <button type="submit">
                        Send message
                    </button>

                </form>


                <!-- ================= CONTACT INFORMATION ================= -->

                <div>

                    <a href="mailto:hello@prime.app">
                        ✉ hello@prime.app
                    </a>

                    <a href="tel:+50760000000">
                        ☎ +507 6000-0000
                    </a>

                </div>

            </div>


            <!-- ================= FAQ ================= -->

            <div>


                <div>

                    <h2>
                        How do I book a court?
                    </h2>

                    <button>
                        ×
                    </button>

                    <p>
                        Explore the court map, filter by sport and
                        schedule, and confirm your booking in seconds.
                    </p>

                </div>


                <div>

                    <h2>
                        Are the coaches certified?
                    </h2>

                    <button>
                        +
                    </button>

                </div>


                <div>

                    <h2>
                        Can I cancel a booking?
                    </h2>

                    <button>
                        +
                    </button>

                </div>


            </div>

        </section>

    </main>


</body>

</html>
